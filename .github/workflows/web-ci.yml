name: web-ci
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no Vercel token (Git integration handles deploys)
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN secret not set - skipping CLI deploy."
      - name: Install pinned Vercel CLI (checksum-verified)
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_CLI_VERSION: "65.8.0"
          VERCEL_CLI_SHA1: "395da13630d0eb971fd78a440b2139e21edc60a7"
        run: |
          cd "$RUNNER_TEMP"
          npm pack "vercel@${VERCEL_CLI_VERSION}" --silent
          echo "${VERCEL_CLI_SHA1}  vercel-${VERCEL_CLI_VERSION}.tgz" | sha1sum -c -
          npm install -g "./vercel-${VERCEL_CLI_VERSION}.tgz"
          vercel --version
      - name: Deploy to Vercel (prod)
        if: env.VERCEL_TOKEN != ''
        working-directory: web
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
